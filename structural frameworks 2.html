<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Layout Properties Demo</title>

    <style>

        /* Styles the whole page */
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1{
            color: darkblue;
        }

        h2{
            color: darkred;
        }

        /* Common style for all boxes */
        .box{
            width: 100px;
            height: 100px;
            background-color: royalblue;
            color: white;
            font-size: 25px;

            /* Center the text inside each box */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Flexbox Container */
        .flex-container{

            display: flex;                 /* Enables Flexbox */

            flex-direction: row;          /* Horizontal direction */

            justify-content: center;    /* Centers horizontally */

            align-items: center;          /* Centers vertically */

            gap: 20px;                    /* Space between boxes */

            border: 2px solid black;

            height: 250px;

            margin-bottom: 50px;

            background-color: lightgray;

        }

        /* Grid Container */
        .grid-container{

            display: grid;                     /* Enables Grid */

            grid-template-columns: repeat(3,100px);

            grid-template-rows: repeat(2,100px);

            gap: 20px;

            justify-content: center;

        }

    </style>

</head>

<body>

    <h1>CSS Layout Properties Demo</h1>

    <h2>Flexbox Example</h2>

    <div class="flex-container">

        <div class="box">1</div>

        <div class="box">2</div>

        <div class="box">3</div>

    </div>

    <h2>Grid Example</h2>

    <div class="grid-container">

        <div class="box">A</div>

        <div class="box">B</div>

        <div class="box">C</div>

        <div class="box">D</div>

        <div class="box">E</div>

        <div class="box">F</div>

    </div>

</body>
</html>
