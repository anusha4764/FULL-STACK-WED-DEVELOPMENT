services:
  - type: web
    name: student-records-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard
      - key: FRONTEND_URL
        sync: false # Set to your Vercel deployment URL (e.g. https://student-management.vercel.app)
    healthCheckPath: /api/health
